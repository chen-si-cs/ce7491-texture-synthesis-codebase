name: Algorithm checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python check_implementation.py
      - run: python run_experiments.py --synthetic-only --size 24 --windows 5 --out output/smoke
      - run: python make_demos.py output/smoke/rings_w5.npz --output output/smoke/growth.gif --frames 20
